let audioCtx, master, muted = false, musicStep = 0, nextBeat = 0;
function enableAudio() {
  const Context = window.AudioContext || window.webkitAudioContext;
  if (!Context) return;
  if (!audioCtx) {
    audioCtx = new Context();
    master = audioCtx.createGain();
    master.gain.value = muted ? 0 : .36;
    master.connect(audioCtx.destination);
  }
  if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
}
function tone(start, end, duration, wave, volume, at) {
  const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
  osc.type = wave;
  osc.frequency.setValueAtTime(start, at);
  osc.frequency.exponentialRampToValueAtTime(end, at + duration);
  gain.gain.setValueAtTime(.0001, at);
  gain.gain.exponentialRampToValueAtTime(volume, at + .006);
  gain.gain.exponentialRampToValueAtTime(.0001, at + duration);
  osc.connect(gain); gain.connect(master);
  osc.start(at); osc.stop(at + duration);
  osc.onended = () => { osc.disconnect(); gain.disconnect(); };
}
function sound(name) {
  if (!audioCtx || audioCtx.state !== 'running' || muted || document.hidden) return;
  tone(...effects[name], .15, audioCtx.currentTime);
}
function music() {
  if (!audioCtx || audioCtx.state !== 'running' || muted || document.hidden || G.state !== 'play') return;
  const track = tracks[G.ep], now = audioCtx.currentTime;
  nextBeat = Math.max(nextBeat, now);
  while (nextBeat < now + .08) {
    const note = track.melody[musicStep];
    const hz = midi => 440 * 2 ** ((midi - 69) / 12);
    if (note) tone(hz(note), hz(note), track.step * 1.2, track.wave, .085, nextBeat);
    if (musicStep % 2 === 0) {
      const bass = hz(track.bass[Math.floor(musicStep / 8)] + (musicStep % 4 ? 7 : 0));
      tone(bass, bass, track.step * 1.7, 'triangle', .18, nextBeat);
    }
    if (musicStep % 4 === 0) tone(120, 38, .09, 'sine', .21, nextBeat);
    else if (musicStep % 4 === 2) tone(850, 210, .04, 'square', .045, nextBeat);
    nextBeat += track.step;
    musicStep = (musicStep + 1) % track.melody.length;
  }
}

// ================== UTILIDADES ==================
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function R(g, x, y, w, h, col) { g.fillStyle = col; g.fillRect(x | 0, y | 0, w, h); }
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function line(g, x0, y0, x1, y1, col, s = 1) {
  x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let err = dx + dy; g.fillStyle = col;
  for (;;) {
    g.fillRect(x0, y0, s, s);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * err;
    if (e2 >= dy) { err += dy; x0 += sx; }
    if (e2 <= dx) { err += dx; y0 += sy; }
  }
}
function overlap(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

// ================== SPRITES ==================
function flipCanvas(c) { const f = mk(c.width, c.height), g = f.getContext('2d'); g.scale(-1, 1); g.drawImage(c, -c.width, 0); return f; }
function whiteCanvas(c) { const f = mk(c.width, c.height), g = f.getContext('2d'); g.drawImage(c, 0, 0); g.globalCompositeOperation = 'source-in'; R(g, 0, 0, c.width, c.height, '#ffffff'); return f; }
function wrapSprite(c) { const f = flipCanvas(c); return { c, f, w: whiteCanvas(c), wf: whiteCanvas(f), width: c.width, height: c.height }; }
function makeSprite(rows, pal) {
  const h = rows.length, w = Math.max(...rows.map(r => r.length));
  const c = mk(w, h), g = c.getContext('2d');
  for (let y = 0; y < h; y++) for (let x = 0; x < rows[y].length; x++) {
    const ch = rows[y][x];
    if (ch !== '.' && ch !== ' ' && pal[ch]) R(g, x, y, 1, 1, pal[ch]);
  }
  return wrapSprite(c);
}
// desenha sprite (flip = espelhado, white = piscando de branco)
function spr(s, x, y, flip, white) {
  const img = white ? (flip ? s.wf : s.w) : (flip ? s.f : s.c);
  ctx.drawImage(img, Math.round(x), Math.round(y));
}

// ================== JOGADOR ==================
function playerBox(p) { const h = p.crouch ? 14 : 22; return { x: p.x - 5, y: p.y - h, w: 10, h }; }
function swordBox(p) {
  if (p.dead || p.attackT < 5) return null;
  if (p.attackT >= 10) return { x: p.face > 0 ? p.x + 5 : p.x - 21, y: p.y - 15, w: 16, h: 6 };
  return { x: p.face > 0 ? p.x + 2 : p.x - 28, y: p.y - 24, w: 26, h: 16 };
}
function hurtPlayer(fromX, fall = false) {
  const p = G.player;
  if ((!fall && p.invT > 0) || p.dead || G.state !== 'play') return;
  sound(fall ? 'fall' : 'hurt');
  p.hp--; p.invT = 90; p.hurtT = 18; p.attackT = -1; p.crouch = false;
  const d = p.x < fromX ? -1 : 1;
  p.vx = fall ? 0 : d * 2; p.vy = fall ? 0 : -2.5; p.onGround = fall;
  G.shake = 8; G.hitStop = 4;
  debris(p.x, p.y - 14, ['#e82838', '#ffffff'], 6);
  if (p.hp <= 0) { p.dead = true; p.deadT = 0; p.vy = -3; }
}
function updatePlayer() {
  const p = G.player;
  if (p.invT > 0) p.invT--;
  if (p.dead) {
    p.deadT++;
    p.x += p.vx; p.vx *= 0.9; p.vy += 0.25; p.y += p.vy;
    if (p.y >= GROUND) { p.y = GROUND; p.vy = 0; p.onGround = true; }
    p.x = clamp(p.x, G.arena[0] + 6, G.arena[1] - 6);
    return;
  }
  const upX = G.stage.ladderX, downX = upX + LADDER_SPAN;
  if (p.hurtT || keys.left || keys.right) p.climbing = false;
  else if (p.onGround && p.attackT < 0) {
    const rail = [upX, downX].find(x => Math.abs(p.x - x) <= 7);
    if (rail !== undefined && ((p.y === GROUND && keys.up) || (p.y === LADDER_TOP && keys.down))) {
      p.climbing = true;
      p.x = rail;
    }
  }
  if (p.climbing) {
    const previousRung = Math.floor((GROUND - p.y) / 7);
    p.vx = p.vy = 0;
    p.crouch = false;
    p.y = clamp(p.y + ((keys.down ? 1 : 0) - (keys.up ? 1 : 0)) * 1.2, LADDER_TOP, GROUND);
    if (Math.floor((GROUND - p.y) / 7) !== previousRung) sound('rung');
    p.onGround = p.y === GROUND || p.y === LADDER_TOP;
    if (p.onGround) {
      p.fromPlatform = p.y === LADDER_TOP;
      p.climbing = false;
    }
    return;
  }
  if (p.hurtT > 0) {
    p.hurtT--; p.vx *= 0.92;
  } else {
    const move = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
    if (p.attackT >= 0) { p.attackT++; if (p.attackT >= 18) p.attackT = -1; }
    if (pressed.z && p.attackT < 0) { p.attackT = 0; G.attackId++; sound('slash'); }
    if (keys.down && p.onGround && !p.crouch && p.attackT < 0) sound('crouch');
    p.crouch = !!keys.down && p.onGround && p.attackT < 0;
    if (p.attackT >= 0 && p.onGround) p.vx = 0;
    else p.vx = move * (p.crouch ? 0.8 : 1.4);
    if (move && p.attackT < 0) p.face = move;
    if (pressed.up && p.onGround && !p.crouch && p.attackT < 0) { sound('jump'); p.vy = -4.6; p.onGround = false; }
    if (!keys.up && p.vy < -1.5) p.vy = -1.5;
    if (move && p.onGround && !p.crouch && p.attackT < 0) p.walkT++; else p.walkT = 0;
    if (p.walkT % 16 === 1) sound('step');
  }
  const wasGrounded = p.onGround, previousY = p.y;
  p.x += p.vx;
  p.vy += 0.25; p.y += p.vy;
  const overDeck = p.x >= upX - PLATFORM_LIP && p.x <= downX + PLATFORM_LIP;
  p.onGround = false;
  if (overDeck && previousY <= LADDER_TOP && p.y >= LADDER_TOP) {
    p.y = LADDER_TOP; p.vy = 0; p.onGround = true; p.fromPlatform = true;
  } else if (p.y >= GROUND) {
    p.y = GROUND; p.vy = 0; p.onGround = true;
    if (p.fromPlatform) hurtPlayer(p.x, true);
    p.fromPlatform = false;
  }
  if (!wasGrounded && p.onGround && !p.hurtT) sound('land');
  p.x = clamp(p.x, G.arena[0] + 6, G.arena[1] - 6);
}
function drawPlayer() {
  const p = G.player, left = Math.round(p.x - 8 - G.cam), top = Math.round(p.y - 24), fl = p.face < 0;

function enemyBox(e) {
  if (e.species === 'snake') return { x: e.x - 10, y: e.y - 13, w: 20, h: 13 };
  if (e.species === 'wolf') return { x: e.x - 12, y: e.y - 16, w: 25, h: 16 };
  return { x: e.x - 8, y: e.y - 19, w: 16, h: 19 }; }
function moveEnemy(e, p) {
  if (e.state === 'hurt') {
    e.x += e.vx; e.vx *= 0.85;
    if (--e.t <= 0) e.state = 'walk';
    return;
  }
  if (p.dead) return;
  e.state = 'walk';
  const dx = p.x - e.x;
  if (Math.abs(dx) > 2) e.face = dx > 0 ? 1 : -1;
  if (Math.abs(dx) > 4) {
    const stride = e.species === 'snake' ? 0.68 + 0.24 * Math.sin(e.anim * 0.14) : 1;
    e.x += e.face * e.speed * stride;
    e.anim++;

}
function updateEnemies() {

  for (const e of G.enemies) {
    if (e.gone) continue;
    if (e.flash > 0) e.flash--;

    if (!e.active) { if (Math.abs(p.x - e.x) < 170) e.active = true; else continue; }
    moveEnemy(e, p);
    // separação entre monstros
    for (const o of G.enemies) {
      if (o === e || o.gone || o.state === 'dying' || !o.active) continue;
      const d = e.x - o.x;
      if (Math.abs(d) < 14) e.x += (d >= 0 ? 1 : -1) * 0.5;
    }
    e.x = clamp(e.x, G.arena[0] + 8, G.arena[1] - 8);
    const eb = enemyBox(e);
    if (sb && e.lastHit !== G.attackId && overlap(sb, eb)) {
      sound('hit'); e.lastHit = G.attackId; e.hp--; e.flash = 10;
      e.state = 'hurt'; e.t = 16; e.vx = p.face * 3;
      G.hitStop = 4;
      debris(e.x, e.y - 12, ['#ffffff', ALIEN_PALS[e.variant].G], 5);
      if (e.hp <= 0) {

        debris(e.x, e.y - 10, [ALIEN_PALS[e.variant].G, ALIEN_PALS[e.variant].g, '#f8e040', '#a01830'], 16);
        dropPacoca(e.x, e.y - 10);

}

function bossTail(b) {
  const k = Math.min(1, b.t / (b.state === 'windup' ? 30 : b.state === 'strike' ? 6 : 24));

    } else {

      if (dist > attack.far) b.x += b.face * attack.walkSpeed;
      else if (b.cool === 0) setState('windup');
      else if (dist < attack.near && canBack) b.x -= b.face * attack.backSpeed;
    }
    b.x = clamp(b.x, G.arena[0] + 44, G.arena[1] - 44);
  } else if (b.state === 'windup') {
    if (attack.aim) attack.aim(b, dist);
    if (b.t >= attack.windup) setState('strike');
  } else if (b.state === 'strike' && b.t >= attack.strike) {
    setState('hold'); G.shake = attack.shake;
  } else if (b.state === 'hold' && b.t >= attack.hold) {

  const pb = playerBox(p);

}

const BAYER2 = [[0, 8, 2, 10], [12, 4, 14, 6], [3, 11, 1, 9], [15, 7, 13, 5]];
// bolha sombreada em pixel art (cols: contorno, escuro, médio, claro, brilho)
function blob(w, h, cols, m = 0) {
  const c = mk(w, h), g = c.getContext('2d');
  const cx = w / 2, cy = h / 2, rx = w / 2 - m, ry = h / 2 - m;
  const ins = (x, y) => { const dx = (x + 0.5 - cx) / rx, dy = (y + 0.5 - cy) / ry; return dx * dx + dy * dy <= 1; };
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    if (!ins(x, y)) continue;
    let col;
    if (!ins(x - 1, y) || !ins(x + 1, y) || !ins(x, y - 1) || !ins(x, y + 1)) col = cols[0];
    else {
      const nx = (x + 0.5 - cx) / rx, ny = (y + 0.5 - cy) / ry;
      const l = 0.55 - nx * 0.3 - ny * 0.45 + (BAYER2[y & 3][x & 3] / 16 - 0.5) * 0.25;
      col = l < 0.3 ? cols[1] : l < 0.6 ? cols[2] : l < 0.85 ? cols[3] : cols[4];
    }
    R(g, x, y, 1, 1, col);
  }

    if (Math.abs(x - G.player.x) < 130) {
      if (phaseTick === 0) sound('warn');
      if (phaseTick === 34) sound(G.ep === 1 ? 'laser' : 'vent');
    }
    if (hazardPhase(i) === 'active' && overlap(hazardBox(x), pb)) hurtPlayer(x);
  });
}
function drawHazards() {
  hazards().forEach((x, i) => {
    const box = hazardBox(x), sx = box.x - G.cam;
    if (sx + box.w < 0 || sx > W) return;
    const phase = hazardPhase(i);
    if (G.ep === 1) {
      if (phase === 'active') {
        R(ctx, sx, box.y, box.w, box.h, '#a81030');
        R(ctx, sx, box.y + 3, box.w, 2, '#fff0d0');
      } else if (phase === 'warn') {
        for (let dx = 0; dx < box.w; dx += 6) R(ctx, sx + dx, box.y + 4, 2, 1, '#ffd040');
        text('!', sx + 22, box.y - 10, '#ffd040');
      }
    } else {
      const cx = x - G.cam;
      R(ctx, sx - 2, GROUND - 1, box.w + 4, 3, '#281018');
      R(ctx, sx, GROUND - 1, box.w, 1, phase === 'off' ? '#9a3820' : '#ffd040');
      if (phase === 'active') {
        R(ctx, sx, box.y + 5, box.w, box.h - 5, '#c02008');
        for (const dx of [-4, 0, 4]) drawFlame(cx + dx, GROUND - 1, dx ? 11 : box.h, G.t, x);
      } else if (phase === 'warn') {
        for (const dx of [-4, 0, 4]) R(ctx, cx + dx, GROUND - 4 - ((G.t + dx) & 3), 1, 2, '#ffd040');
        text('!', cx - 2, GROUND - 24, '#ffd040');
      }
    }
  });
}
function update() {
  if (G.state === 'menu') return updateMenu();
  G.t++;
  if (G.ep !== 3) updateSky();
  if (G.ep === 2) updateEmbers();
  if (G.hitStop > 0) { G.hitStop--; return; }
  if (G.shake > 0) G.shake--;

  if (G.state === 'play') {
    updatePlayer();
    updateEnemies();
    updateBoss();
    if (!G.checkpoint) updateHazards();
    updateItems();
    if (!G.checkpoint) {
      G.cam = clamp(Math.round(G.player.x - 128), 0, ARENA_X);
      if (!G.player.dead && G.player.x >= ARENA_ENTRY && G.enemies.every(e => e.gone)) enterArena();
    }
    if (G.bossTimer > 0) {
      G.bossTimer++;
      if (!G.boss && G.bossTimer > 75 && !G.player.dead) spawnBoss();
    }

    if (G.player.dead) {
      if (G.player.deadT > 70) { sound('over'); G.state = 'over'; G.endT = 0; }
    } else if (G.boss && G.boss.gone) {
      sound('win'); G.state = 'win'; G.endT = 0;
    }
  } else {
    G.endT++;
    if (G.state === 'win') {
      updatePlayer();
      updateItems();
    }
    if (G.state === 'win' && EPISODES[G.ep + 1] && G.endT > 300) {
      newGame(G.ep + 1, G.player.hp, G.score, G.pacocas); return;
    }
    if (G.state === 'over' && G.endT > 40 && pressed.z && G.checkpoint) { retryBoss(); return; }
    if (G.endT > 40) {
      const restart = G.state === 'over' && G.checkpoint ? pressed.x : pressed.z;
      if (restart && (G.state === 'over' || !EPISODES[G.ep + 1])) { openMenu(G.ep); return; }
    }
  }

  for (const q of G.parts) { q.x += q.vx; q.vy += 0.15; q.y += q.vy; if (q.y > GROUND) { q.y = GROUND; q.vy *= -0.4; q.vx *= 0.7; } q.life--; }
  G.parts = G.parts.filter(q => q.life > 0);
  for (const b of G.booms) b.t++;
  G.booms = G.booms.filter(b => b.t < 16);
}

// ================== DESENHO ==================
function drawBoom(b) {
  const x = Math.round(b.x - G.cam), y = Math.round(b.y), s = b.big ? 1.4 : 1, t = b.t;
  const discs = t < 4 ? [[3, '#ffffff']] : t < 8 ? [[6, '#f8a020'], [4, '#fff080'], [2, '#ffffff']] : t < 12 ? [[9, '#c03010'], [7, '#f8a020'], [4, '#fff080']] : [[11, '#601810', 1], [8, '#c03010', 1]];
  for (const [r0, col, dither] of discs) {
    const r = Math.round(r0 * s);
    ctx.fillStyle = col;
    for (let yy = -r; yy <= r; yy++) {
      const w = Math.round(Math.sqrt(r * r - yy * yy));
      if (dither) { for (let xx = -w; xx <= w; xx++) if ((xx + yy + t) & 1) ctx.fillRect(x + xx, y + yy, 1, 1); }
      else ctx.fillRect(x - w, y + yy, w * 2 + 1, 1);
    }
  }
}
// A copa distante desliza mais devagar que as raízes da trilha.
const FOREST_BACK = mk(LEVEL_W, H), FOREST_TRAIL = mk(LEVEL_W, H);
{
  const g = FOREST_BACK.getContext('2d'), f = FOREST_TRAIL.getContext('2d'), r = rng(73);
  R(g, 0, 0, LEVEL_W, H, '#9ecab0');
  for (let x = -20; x < LEVEL_W + 40; x += 23) {
    const y = 53 + Math.floor(r() * 30);
    R(g, x, y, 5, H - y, '#719b87');
    pixelOval(g, x, y, 24, 19, '#82ae92');
  }
  for (let x = 0; x < LEVEL_W + 35; x += 53) {
    const y = 56 + Math.floor(r() * 35);
    R(g, x - 3, y, 9, H - y, '#587f6f');
    line(g, x, y + 39, x - 16, y + 13, '#587f6f', 3);
    pixelOval(g, x - 10, y, 33, 19, '#66997e');
    pixelOval(g, x + 8, y - 9, 22, 15, '#81ab80');
  }
  for (let x = 14; x < LEVEL_W; x += 78 + Math.floor(r() * 36)) {
    const y = 18 + Math.floor(r() * 28);
    R(f, x, y, 15, GROUND - y, '#3e443b'); R(f, x + 3, y, 5, GROUND - y, '#786043');
    line(f, x + 6, y + 56, x - 21, y + 24, '#504936', 5);
    line(f, x + 9, y + 37, x + 30, y + 12, '#504936', 4);
    for (let i = 0; i < 7; i++) {
      const cx = x - 34 + i * 11, cy = y - 5 + Math.floor(r() * 13);
      pixelOval(f, cx, cy, 23, 18, '#254e45');
      pixelOval(f, cx - 3, cy - 7, 20, 12, '#397451');
      for (let j = 0; j < 9; j++) R(f, cx - 12 + r()*24, cy - 14 + r()*8, 3, 1, '#74a75e');
    }
    for (const dx of [-11, 15]) line(f, x + 7, GROUND - 14, x + dx, GROUND, '#504936', 4);
  }
  R(f, 0, GROUND, LEVEL_W, H - GROUND, '#584138');
  R(f, 0, GROUND, LEVEL_W, 3, '#99ba60'); R(f, 0, GROUND + 3, LEVEL_W, 4, '#507644');
  for (let x = 0; x < LEVEL_W; x += 3) {
    R(f, x, GROUND - Math.floor(r()*4), 2, 4, '#6b9950');
    R(f, x, GROUND + 8 + r()*21, 3, 2, '#7b5743');
    if (r() < .08) R(f, x, GROUND - 5, 2, 2, '#f1bf76');
  }
}
function drawForest() {
  ctx.drawImage(FOREST_BACK, -Math.floor(G.cam * .32), 0);
  ctx.drawImage(FOREST_TRAIL, -G.cam, 0);
}
function drawBackground() {
  if (G.ep === 3) return drawForest();
  if (G.ep === 2) return drawBackground2();
  const cam = G.cam;
  const sx = Math.round(cam * 0.05) % 256;
  ctx.drawImage(SKY, -sx, 0); ctx.drawImage(SKY, 256 - sx, 0);
  ctx.drawImage(PLANET, Math.round(170 - cam * 0.08), 30);
  const shx = Math.round(cam * 0.2) % 512;
  ctx.drawImage(SHIPS, -shx, 0); ctx.drawImage(SHIPS, 512 - shx, 0);
  for (const f of G.fighters) spr(FIGHTER, f.x - 4, f.y, f.vx > 0);
  for (const bo of G.bolts) {
    const x = Math.round(bo.x), y = Math.round(bo.y);
    R(ctx, x - 3, y - 1, 7, 1, '#80101c'); R(ctx, x - 3, y + 1, 7, 1, '#80101c');
    R(ctx, x - 4, y, 9, 1, '#ff2030'); R(ctx, x - 2, y, 5, 1, '#ffa0a0');
  }
  const gx = Math.round(cam * 0.5) % 256;
  ctx.drawImage(GIRDERS, -gx, 0); ctx.drawImage(GIRDERS, 256 - gx, 0);
  ctx.drawImage(STATION, -cam, 0);
  // luzes piscantes
  for (const p of PILLARS) {
    const x = p - cam; if (x < -20 || x > W) continue;
    const on = ((G.t + p) >> 5) & 1;
    R(ctx, x + 5, 35, 6, 10, on ? '#ff2020' : '#3a1010');
    if (on) R(ctx, x + 6, 36, 2, 2, '#ffb0b0');
  }
  for (const c of CONSOLES) {
    const x = c - cam; if (x < -40 || x > W) continue;
    R(ctx, x + 22, 158, 3, 3, ((G.t >> 4) & 1) ? '#ff3030' : '#501010');
    R(ctx, x + 22, 163, 3, 3, ((G.t >> 5) & 1) ? '#30ff60' : '#105020');
    R(ctx, x + 4 + ((G.t >> 2) % 14), 167, 2, 1, '#80ffa0');
  }
}

function drawHUD() {
  const p = G.player;
  R(ctx, 0, 0, W, 24, '#000000');
  text('VIDA', 4, 4, '#ffffff', 1, null);
  for (let i = 0; i < Math.max(5, p.hp); i++) spr(i < p.hp ? HEART : HEART_E, 30 + i * Math.min(9, Math.floor(90 / Math.max(5, p.hp))), 3, false);
  if (G.boss && !G.boss.gone) {
    const label = G.stage.shortBossName;
    text(label, 171 - textW(label), 4, '#f08840', 1, null);
    R(ctx, 174, 3, 76, 7, '#ffffff'); R(ctx, 175, 4, 74, 5, '#200808');
    for (let i = 0; i < Math.max(0, G.boss.hp); i++) R(ctx, 176 + i * 7 + 1, 5, 6, 3, '#e83020');
  } else if (!G.checkpoint) {
    const left = G.enemies.filter(e => !e.gone && e.state !== 'dying').length;
    const label = left ? 'MONSTROS: ' + left : 'SIGA ATÉ A ARENA';
    text(label, W - 5 - textW(label), 4, '#80ff80', 1, null);
  }
  spr(PACOCA, 4, 13, false);
  text('PAÇOCAS: ' + G.pacocas, 15, 14, '#f0c888', 1, null);
  const points = 'PONTOS: ' + String(G.score).padStart(6, '0');
  text(points, W - 5 - textW(points), 14, '#ff8070', 1, null);
}
function drawPlatform() {
  const x = G.stage.ladderX - G.cam, end = x + LADDER_SPAN;
  if (end + PLATFORM_LIP < 0 || x - PLATFORM_LIP > W) return;
  const width = LADDER_SPAN + 2 * PLATFORM_LIP + 1;
  R(ctx, x - PLATFORM_LIP, LADDER_TOP, width, 6, '#38344c');
  R(ctx, x - PLATFORM_LIP, LADDER_TOP, width, 2, '#d0bab0');
  for (const rail of [x, end]) {
    for (const dx of [-6, 5]) {
      R(ctx, rail + dx, LADDER_TOP + 2, 3, GROUND - LADDER_TOP - 2, '#38344c');
      R(ctx, rail + dx, LADDER_TOP + 2, 1, GROUND - LADDER_TOP - 2, '#d0bab0');
    }
    for (let y = LADDER_TOP + 5; y < GROUND; y += 7) R(ctx, rail - 4, y, 10, 2, '#a48a70');

  }
}
function drawArenaEntry() {
  const x = ARENA_ENTRY - G.cam;
  if (x < 0 || x > W + 8) return;
  const open = G.enemies.every(e => e.gone);
  const light = open ? '#80ff80' : '#ff6050';
  R(ctx, x - 5, GROUND - 21, 10, 21, '#141420');
  R(ctx, x - 4, GROUND - 20, 8, 19, '#565e7c');
  R(ctx, x - 3, GROUND - 18, 6, 6, '#141420');
  R(ctx, x - 2, GROUND - 17, 4, 4, light);
}
function render() {
  if (G.state === 'menu') return drawMenu();
  ctx.save();
  if (G.shake > 0) ctx.translate(((Math.random() * 3) | 0) - 1, ((Math.random() * 3) | 0) - 1);
  drawBackground();
  drawHazards();
  drawPlatform();
  drawArenaEntry();
  drawBoss();
  drawEnemies();
  drawItems();
  drawPlayer();
  for (const q of G.parts) R(ctx, Math.round(q.x - G.cam), Math.round(q.y), 1, 1, q.col);
  for (const b of G.booms) drawBoom(b);
  for (const u of G.popups) text(u.txt, Math.round(u.x - G.cam - textW(u.txt) / 2), Math.round(u.y - u.t / 3), u.col, 1);
  ctx.restore();
  drawHUD();

  if (G.t < 165 && !G.checkpoint && G.state === 'play') {
    textC('EPISÓDIO ' + G.ep, 48, '#f0c030', 2);
    textC(G.stage.title, 67, '#ffffff');
    textC('DERROTE OS ' + G.enemies.length + ' MONSTROS', 83, '#80ff80');
    textC('E SIGA ATÉ A ARENA', 96, '#80ff80');
    if (G.ep === 1) {
      textC('SETAS: MOVER, PULAR E ABAIXAR', 112, '#ffffff');
      textC('Z: ESPADA    M: SOM', 124, '#ffffff');
    }
  }
  if (G.bossTimer > 0 && (!G.boss || G.boss.state === 'enter') && G.state === 'play') {
    textC('CUIDADO!', 53, '#ff3030', 2);
    textC(G.stage.bossName, 73, '#ffffff');
    textC(G.stage.dodge, 87, '#ffd040');
  }
  if (G.state === 'win') {
    textC('EPISÓDIO ' + G.ep + ' CONCLUÍDO!', 66, '#f0c030');
    if (EPISODES[G.ep + 1]) textC('A SEGUIR: ' + EPISODES[G.ep + 1].title, 87, '#ffffff');
    else if (G.endT > 40) textC('Z: MENU DE EPISÓDIOS', 87, '#ffffff');
  }
  if (G.state === 'over') {
    textC('FIM DE JOGO', 66, '#ff3030', 2);
    if (G.endT > 40 && G.checkpoint) {
      textC('Z: TENTAR O CHEFE DE NOVO', 91, '#f0c030');
      textC('X: MENU DE EPISÓDIOS', 105, '#ffffff');
    } else if (G.endT > 40) textC('Z: MENU DE EPISÓDIOS', 91, '#ffffff');
  }
}

// ================== LAÇO PRINCIPAL (60 FPS fixo) ==================
openMenu();
let last = performance.now(), acc = 0;
const STEP = 1000 / 60;
function frame(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= STEP) {
    update();
    for (const k in pressed) pressed[k] = false;
    acc -= STEP;
  }
  music();
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
